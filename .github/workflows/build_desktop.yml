name: Build Desktop Apps (macOS & Windows)

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - '*.py'
      - 'fonts/**'
      - 'installer/**'
      - 'package_macos.sh'
      - 'build_windows_exe.bat'
      - '.github/workflows/build_desktop.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS (DMG & ZIP)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build tools for bundled FFmpeg
        run: brew install pkgconf

      - name: Package macOS App & DMG
        run: |
          chmod +x package_macos.sh
          ./package_macos.sh

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AURA-REC-macOS
          path: |
            dist/AURA-REC-macOS.dmg
            dist/AURA-REC-macOS.zip
            dist/AURA-REC-ffmpeg-source.tar.gz
          if-no-files-found: warn

  build-windows:
    name: Build Windows (EXE & ZIP)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Build Windows EXE & Package
        shell: cmd
        run: |
          build_windows_exe.bat
        env:
          PYTHONUNBUFFERED: "1"
          # FFmpeg 為 GPL/LGPL 混合授權，發行包不隨附；使用者自行安裝（winget install Gyan.FFmpeg）
          AURA_NO_FFMPEG_BUNDLE: "1"

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AURA-REC-Windows
          path: |
            dist/AURA-REC.exe
            dist/AURA-REC-Windows-x64.zip
            dist/AURA-REC-Setup.exe
          if-no-files-found: warn

  release:
    name: Create GitHub Release
    needs: [build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-release

      - name: Generate SHA256SUMS
        run: |
          cd dist-release
          find . -type f ! -name SHA256SUMS.txt -exec shasum -a 256 {} + | sed 's# \./[^/]*/# #' > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-release/AURA-REC-macOS/*
            dist-release/AURA-REC-Windows/*
            dist-release/SHA256SUMS.txt
          draft: false
          prerelease: false
