name: Check web build

on:
  push:
    paths:
      - web_studio/**
      - tools/tailwind/**
      - .github/workflows/check_web.yml
  pull_request:
    paths:
      - web_studio/**
      - tools/tailwind/**

jobs:
  tailwind-and-csp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Rebuild Tailwind CSS and CSP hashes
        working-directory: tools/tailwind
        run: |
          npm ci
          npm run build
      - name: Fail if the committed pages are stale
        run: |
          git diff --exit-code -- web_studio || {
            echo "::error::web_studio pages are out of date. Run 'cd tools/tailwind && npm run build' and commit."
            exit 1
          }
